// Versi syntax protobuf yang digunakan (selalu pakai "proto3")
syntax = "proto3";

// Nama package untuk menghindari konflik nama
package auth;

// ============================================================
// DEFINISI SERVICE (Layanan yang tersedia)
// ============================================================
// Service ini seperti "daftar menu" — berisi fungsi-fungsi
// yang bisa dipanggil oleh client (frontend/aplikasi lain)
// ============================================================

service AuthService {
  // Fungsi untuk mendaftarkan user baru
  rpc Register (RegisterRequest) returns (RegisterResponse);

  // Fungsi untuk login user
  rpc Login (LoginRequest) returns (LoginResponse);

  // Fungsi untuk logout user
  rpc Logout (LogoutRequest) returns (LogoutResponse);
}

// ============================================================
// DEFINISI MESSAGE (Format data yang dikirim & diterima)
// ============================================================
// Message ini seperti "formulir" — menentukan data apa saja
// yang harus diisi saat mengirim atau menerima request
// ============================================================

// --- REGISTER ---

// Data yang dikirim client saat register
message RegisterRequest {
  string name = 1;      // Nama lengkap user
  string email = 2;     // Email user (harus unik)
  string password = 3;  // Password user (akan di-hash di server)
}

// Data yang dikirim server sebagai balasan register
message RegisterResponse {
  bool success = 1;     // true = berhasil, false = gagal
  string message = 2;   // Pesan hasil (contoh: "Registrasi berhasil")
}

// --- LOGIN ---

// Data yang dikirim client saat login
message LoginRequest {
  string email = 1;     // Email user
  string password = 2;  // Password user
}

// Data yang dikirim server sebagai balasan login
message LoginResponse {
  bool success = 1;     // true = berhasil, false = gagal
  string message = 2;   // Pesan hasil (contoh: "Login berhasil")
  string token = 3;     // Token sesi untuk autentikasi selanjutnya
}

// --- LOGOUT ---

// Data yang dikirim client saat logout
message LogoutRequest {
  string token = 1;     // Token sesi yang ingin di-logout
}

// Data yang dikirim server sebagai balasan logout
message LogoutResponse {
  bool success = 1;     // true = berhasil, false = gagal
  string message = 2;   // Pesan hasil (contoh: "Logout berhasil")
}
